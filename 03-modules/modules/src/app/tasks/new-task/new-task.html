<div class="backdrop" (click)="onCancel()"></div>
<dialog open>
  <h2>Add a task</h2>
  <form (ngSubmit)="onSubmit()"> <!-- FormsModule automatically binds the form-->
    <p>
      <label for="title">Title</label>
      <input type="text" id="title" name="title" [(ngModel)]="enteredTitle" />
    </p>
    <p>
      <label for="summary">Summary</label>
      <textarea id="summary" name="summary" rows="5" [(ngModel)]="enteredSummary"></textarea>
    </p>
    <p>
      <label for="due-date">Due Date</label>
      <input type="date" id="due-date" name="due-date" [(ngModel)]="enteredDate" />
    </p>
    <p class="actions">
      <button type="button" (click)="onCancel()">Cancel</button>
      <button type="submit">Create Task</button> <!-- 'submit' trigger a form submission-->
    </p>
  </form>
</dialog>
