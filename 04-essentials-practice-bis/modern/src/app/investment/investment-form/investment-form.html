<div>
  <form (ngSubmit)="onSubmit()">
    <div class="input-group">
      <div class="form-control">
        <label for="initial_investment">Initial investment</label>
        <input
          type="number"
          id="initial_investment"
          name="initial_investment"
          [(ngModel)]="enteredInitialInvestment"
        />
      </div>

      <div class="form-control">
        <label for="annual_investment">Annual investment</label>
        <input
          type="number"
          id="annual_investment"
          name="annual_investment"
          [(ngModel)]="enteredAnnualInvestment"
        />
      </div>
    </div>

    <div class="input-group">
      <div class="form-control">
        <label for="expected_return">Expected return</label>
        <input
          type="number"
          id="expected_return"
          name="expected_return"
          [(ngModel)]="enteredExpectedReturn"
        />
      </div>

      <div class="form-control">
        <label for="duration">Duration</label>
        <input type="number" id="duration" name="duration" [(ngModel)]="enteredDuration" />
      </div>
    </div>

    <p class="actions">
      <button type="submit">CALCULATE</button>
    </p>
  </form>
</div>
